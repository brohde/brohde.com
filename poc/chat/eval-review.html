  const KEY = "brohde.evalreview." + DATA.run;
  const state = JSON.parse(localStorage.getItem(KEY) || "{}");
  const cats = [...new Set(DATA.items.map((i) => i.cat))];
  let filter = "all";

  document.getElementById("runmeta").textContent =
    DATA.run +
    " · " +
    DATA.items.length +
    " questions · total cost " +
    DATA.totalCost;

  const filters = document.getElementById("filters");
  ["all", ...cats].forEach((c) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = c;
    b.setAttribute("aria-pressed", String(c === filter));
    b.onclick = () => {
      filter = c;
      render();
    };
    filters.appendChild(b);
  });

  function esc(s) {
    return s.replace(
      /[&<>"]/g,
      (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]
    );
  }
  function linkify(s) {
    return s.replace(
      /\[([^\]]{1,60})\]\((\/[a-z-]+)\)/g,
      '<a href="#" onclick="return false" title="links to $2 on the real site">$1</a>'
    );
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function render() {
    filters
      .querySelectorAll(".chip")
      .forEach((b) =>
        b.setAttribute("aria-pressed", String(b.textContent === filter))
      );
    const list = document.getElementById("list");
    list.innerHTML = "";
    DATA.items.forEach((it, i) => {
      if (filter !== "all" && it.cat !== filter) return;
      const s = state[i] || {};
      const card = document.createElement("section");
      card.className = "card" + (s.v ? " " + s.v : "");
      card.innerHTML =
        '<span class="cat">' +
        esc(it.cat) +
        "</span>" +
        '<p class="q"><span class="p">$</span> ' +
        esc(it.q) +
        "</p>" +
        '<p class="act">action: <b>' +
        esc(it.action) +
        "</b></p>" +
        (it.reply && it.reply !== "(no text)"
          ? '<div class="reply">' + linkify(esc(it.reply)) + "</div>"
          : '<p class="act">(no text, navigation only)</p>') +
        '<p class="cost"># ' +
        esc(it.cost) +
        "</p>";
      const v = document.createElement("div");
      v.className = "verdict";
      const bp = document.createElement("button");
      bp.className = "vbtn" + (s.v === "pass" ? " on-pass" : "");
      bp.textContent = "pass";
      bp.onclick = () => {
        s.v = s.v === "pass" ? null : "pass";
        state[i] = s;
        save();
        render();
      };
      const bf = document.createElement("button");
      bf.className = "vbtn" + (s.v === "fail" ? " on-fail" : "");
      bf.textContent = "fail";
      bf.onclick = () => {
        s.v = s.v === "fail" ? null : "fail";
        state[i] = s;
        save();
        render();
      };
      const note = document.createElement("input");
      note.className = "note";
      note.placeholder = "note (optional)";
      note.value = s.n || "";
      note.oninput = () => {
        s.n = note.value;
        state[i] = s;
        save();
        prog();
      };
      v.append(bp, bf, note);
      card.appendChild(v);
      list.appendChild(card);
    });
    prog();
  }

  function prog() {
    const marked = DATA.items.filter((_, i) => state[i]?.v).length;
    const fails = DATA.items.filter((_, i) => state[i]?.v === "fail").length;
    document.getElementById("prog").innerHTML =
      "<b>" +
      marked +
      "/" +
      DATA.items.length +
      "</b> marked · <b>" +
      fails +
      "</b> fail";
    document.getElementById("copy").disabled = marked === 0;
  }

  document.getElementById("copy").onclick = async () => {
    const lines = ["# Eval verdicts · " + DATA.run];
    DATA.items.forEach((it, i) => {
      const s = state[i] || {};
      lines.push(
        i +
          1 +
          ". [" +
          it.cat +
          "] " +
          it.q +
          " → " +
          (s.v ? s.v.toUpperCase() : "UNMARKED") +
          (s.n ? " · note: " + s.n : "")
      );
    });
    const text = lines.join("\n");
    const out = document.getElementById("out");
    out.value = text;
    out.style.display = "block";
    try {
      await navigator.clipboard.writeText(text);
      document.getElementById("xnote").textContent =
        "copied. paste it into the Claude session.";
    } catch {
      out.focus();
      out.select();
      document.getElementById("xnote").textContent =
        "clipboard blocked: select the box below and copy manually.";
    }
  };

  render();
</script>
